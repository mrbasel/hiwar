<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بحث في البودكاست</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <form id="search" class="search" role="search">
      <div class="query">
        <input id="q" name="q" type="search" placeholder="ابحث في كل الحلقات…" autocomplete="off" autofocus aria-label="Search">
        <button type="submit">ابحث</button>
      </div>
      <label class="option"><input id="keyword" type="checkbox"> بحث بالكلمات فقط</label>
    </form>
  </header>

  <main>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="results"></div>
    <nav id="pager" class="pager" hidden>
      <button id="prev" type="button">السابق</button>
      <span id="page"></span>
      <button id="next" type="button">التالي</button>
    </nav>

    <section id="intro" class="intro">
      <h1>ابحث في أكثر من ١٠ آلاف ساعة من حلقات البودكاست</h1>
      <p>تظهر النتائج مع التوقيت داخل الحلقة، اضغط عليه لتفتح المقطع على يوتيوب.</p>
      <p class="try">جرّب: <a href="?q=الحرية+المالية">الحرية المالية</a> <a href="?q=سوق+العقار">سوق العقار</a> <a href="?q=تربية+الأطفال">تربية الأطفال</a></p>
    </section>
  </main>

  <template id="episode-tpl">
    <article class="episode">
      <header>
        <h2><a class="ep-title" target="_blank" rel="noopener"></a></h2>
        <p class="ep-meta"><span class="show"></span><time class="date"></time><span class="duration"></span><span class="via"></span></p>
      </header>
      <button type="button" class="toggle" aria-expanded="false"></button>
      <div class="sections" hidden></div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
