---
- name: Run the app as a service, and the pipeline that takes in new episodes
  hosts: rawi
  become: true

  tasks:
    - name: Create the user the app runs as
      ansible.builtin.user:
        name: rawi
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    # Deploys write as deploy (GitHub Actions) or basel (data, from a laptop)
    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true

    - name: Let admins deploy too
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ deploy_user }}"
        append: true
      loop: "{{ admin_users }}"

    # Writes the database: pipeline.ingest (for the downloader, over ssh) and
    # pipeline.worker. The deploy group shares it with the API.
    - name: Create the user the pipeline runs as
      ansible.builtin.user:
        name: rawi-writer
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        groups: "{{ deploy_user }}"
        append: true

    - name: Install the deploy key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        exclusive: true

    # Releases and data are owned by the deploy group and readable by all
    - name: Create the release and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "2775"
      loop:
        - /srv/rawi
        - /srv/rawi/releases
        - /srv/rawi/data
        - /srv/rawi/.uv-cache

    # Shared by the worker and rawi-activate; rawi-ingest writes the trigger
    - name: Create the worker's lock and trigger files
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        owner: rawi-writer
        group: "{{ deploy_user }}"
        mode: "0664"
        modification_time: preserve
        access_time: preserve
      loop:
        - /srv/rawi/data/worker.lock
        - /srv/rawi/data/worker.trigger

    - name: Install the activate and ingest scripts
      ansible.builtin.copy:
        src: ../deploy/{{ item.src }}
        dest: /usr/local/bin/{{ item.dest }}
        mode: "0755"
      loop:
        - { src: activate.sh, dest: rawi-activate }
        - { src: ingest.sh, dest: rawi-ingest }

    - name: Let the deploy group restart the app and read its logs
      community.general.sudoers:
        name: rawi-deploy
        group: "{{ deploy_user }}"
        commands:
          - /usr/bin/systemctl restart rawi
          - /usr/bin/journalctl -u rawi -n 30 --no-pager
        nopassword: true

    - name: Create the config directory
      ansible.builtin.file:
        path: /etc/rawi
        state: directory
        mode: "0755"

    - name: Write the app's environment
      ansible.builtin.template:
        src: templates/rawi.env.j2
        dest: /etc/rawi/rawi.env
        owner: root
        group: rawi
        mode: "0640"
      diff: false # it holds secrets
      notify: Restart the app

    - name: Write the pipeline's environment
      ansible.builtin.template:
        src: templates/pipeline.env.j2
        dest: /etc/rawi/pipeline.env
        owner: root
        group: rawi-writer
        mode: "0640"
      diff: false # it holds secrets

    - name: Install the systemd unit
      ansible.builtin.template:
        src: templates/rawi.service.j2
        dest: /etc/systemd/system/rawi.service
        mode: "0644"
      notify: Restart the app

    - name: Install the worker's systemd units
      ansible.builtin.template:
        src: templates/{{ item }}.j2
        dest: /etc/systemd/system/{{ item }}
        mode: "0644"
      loop:
        - rawi-worker.service
        - rawi-worker.path
        - rawi-worker.timer
      register: worker_units

    # Started by the first deploy that finds a release and data in place
    - name: Enable the app at boot
      ansible.builtin.systemd_service:
        name: rawi
        enabled: true
        daemon_reload: true

    - name: Start the worker's path unit and timer
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: "{{ worker_units.changed }}"
      # A dry run hasn't installed them
      ignore_errors: "{{ ansible_check_mode }}"
      loop:
        - rawi-worker.path
        - rawi-worker.timer

  handlers:
    # Not before the first deploy, when there's nothing to run yet
    - name: Restart the app
      ansible.builtin.shell: |
        systemctl daemon-reload
        if [ -e /srv/rawi/current ] && [ -e /srv/rawi/data/current ]; then
          systemctl restart rawi
        fi
      changed_when: true
