---
- name: Prepare the server to run the app
  hosts: rawi
  become: true

  tasks:
    # The API holds ~300 MB of a 1 GB server; swap absorbs spikes instead of
    # the OOM killer
    - name: Create the swap file
      ansible.builtin.command: fallocate -l {{ swap_size }} /swapfile
      args:
        creates: /swapfile
      register: swapfile

    - name: Format and enable the swap file
      when: swapfile.changed and not ansible_check_mode
      block:
        - name: Restrict the swap file to root
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"

        - name: Format the swap file
          ansible.builtin.command: mkswap /swapfile
          changed_when: true

        - name: Enable the swap file
          ansible.builtin.command: swapon /swapfile
          changed_when: true

    - name: Enable the swap file at boot
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present

    - name: Prefer dropping cache to swapping the app out
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/90-swap.conf

    # Ubuntu's nodejs is 22; the app is developed and built on 24
    - name: Add NodeSource's signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"

    - name: Add the Node.js {{ node_major }} repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
        filename: nodesource
        state: present

    - name: Install Node.js and rsync
      ansible.builtin.apt:
        name:
          - nodejs
          - rsync
        state: present

    # The pipeline that takes in new episodes (pipeline.ingest, pipeline.worker)
    # runs on Python {{ python_version }} from uv; rawi-activate gives each
    # release its environment
    - name: Create the directory for uv {{ uv_version }}
      ansible.builtin.file:
        path: /opt/uv/{{ uv_version }}
        state: directory
        mode: "0755"

    - name: Install uv {{ uv_version }}
      ansible.builtin.unarchive:
        src: https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz
        dest: /opt/uv/{{ uv_version }}
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: /opt/uv/{{ uv_version }}/uv
      # A dry run hasn't made the directory
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Put uv on the PATH
      ansible.builtin.file:
        src: /opt/uv/{{ uv_version }}/uv
        dest: /usr/local/bin/uv
        state: link
      ignore_errors: "{{ ansible_check_mode }}"

    # Where releases' environments find it (see deploy/activate.sh)
    - name: Install Python {{ python_version }}
      ansible.builtin.command: uv python install {{ python_version }}
      environment:
        UV_PYTHON_INSTALL_DIR: /opt/uv/python
      register: python_install
      changed_when: "'Installed' in python_install.stderr"
