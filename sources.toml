# Every YouTube source scripts/update.sh downloads.
#
# url      channel (@handle; downloads its Videos tab) or playlist (?list=...); required
# name     show or channel name, shown in logs and --status
# group    network the source belongs to
# notes    anything worth knowing about it
# enabled  false to stop downloading it; default true
# folder   folder under data/ to save into; default the channel name, or the
#          playlist title for playlists
#
# Use playlists for channels that mix podcasts with other videos, or to give each
# show its own folder. A new source is downloaded in full on the next run.

