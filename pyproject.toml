[project]
name = "rawi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# What the server's pipeline (pipeline.ingest, pipeline.worker) needs.
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
download = [
    "yt-dlp[default]>=2026.10.26",
]
map = [
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]

[tool.uv]
package = false
# Everything locally; the server syncs with --no-default-groups.
default-groups = ["download", "map"]
